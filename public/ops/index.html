      <div class="tabs">${tabsHtml}</div>
      <div class="tab-body">${bodyHtml}</div>
    </div>
  `;
  document.body.appendChild(host);
  const panelEl = host.querySelector(".panel");
  panelEl.addEventListener("click", (e) => e.stopPropagation());
  if (isFreshOpen) requestAnimationFrame(() => panelEl.classList.add("shown"));

  host.querySelector("#closePanel").addEventListener("click", () => { openOrderId = null; renderPanel(); });
  host.querySelector("#quickPrint").addEventListener("click", () => { logDoc(order, "invoice", "printed"); printHtml(buildInvoiceHtml(order)); });
  host.querySelector("#removeOrderBtn").addEventListener("click", () => removeOrder(order));
  const markBtn = host.querySelector("#markCompleteBtn");
  if (markBtn) markBtn.addEventListener("click", () => { setOrderStage(order, "completed"); renderCurrentView(); renderPanel(); });
  host.querySelectorAll("[data-stage]").forEach((b) => b.addEventListener("click", () => { setOrderStage(order, b.dataset.stage); renderCurrentView(); renderPanel(); }));
  host.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { activeTab = b.dataset.tab; renderPanel(); }));

  if (activeTab === "checklist") {
    host.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", () => {
      const items = effectiveChecklist(order);
      const idx = parseInt(b.dataset.toggle, 10);
      items[idx] = { ...items[idx], done: !items[idx].done };
      saveChecklist(order, items);
    }));
    host.querySelector("#addChecklistBtn").addEventListener("click", () => {
      const input = host.querySelector("#newChecklistItem");
      const label = input.value.trim();
      if (!label) return;
      saveChecklist(order, [...effectiveChecklist(order), { label, done: false }]);
    });
  }

  if (activeTab === "issues") {
    host.querySelectorAll("[data-catfilter]").forEach((b) => b.addEventListener("click", () => {
      activeIssueCategory = b.dataset.catfilter; renderPanel();
    }));
    host.querySelectorAll("[data-resolve]").forEach((b) => b.addEventListener("click", () => {
      const i = ISSUES.find((x) => x.id === b.dataset.resolve);
      i.resolved = !i.resolved;
      renderCurrentView(); renderPanel();
    }));
    host.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => {
      ISSUES = ISSUES.filter((x) => x.id !== b.dataset.remove);
      renderCurrentView(); renderPanel();
    }));
    host.querySelector("#openIssueForm").addEventListener("click", () => renderIssueForm(host, order));
  }

  if (activeTab === "documents") {
    host.querySelectorAll("[data-doc]").forEach((b) => b.addEventListener("click", () => {
      docModalKind = b.dataset.doc;
      logDoc(order, docModalKind, "generated");
      renderPanel();
    }));
    host.querySelectorAll("[data-previewkind]").forEach((b) => b.addEventListener("click", () => {
      docModalKind = b.dataset.previewkind;
      logDoc(order, docModalKind, "generated");
      renderPanel();
    }));
    host.querySelector("#printDocBtn").addEventListener("click", () => {
      logDoc(order, docModalKind, "printed");
      printHtml(docModalKind === "invoice" ? buildInvoiceHtml(order) : buildPackingSlipHtml(order));
      renderPanel();
    });
    host.querySelectorAll("[data-removeresource]").forEach((b) => b.addEventListener("click", () => {
      const idx = parseInt(b.dataset.removeresource, 10);
      order.resources = (order.resources || []).filter((_, i) => i !== idx);
      renderPanel();
    }));
    host.querySelector("#addResourceBtn").addEventListener("click", () => {
      const labelInput = host.querySelector("#newResourceLabel");
      const urlInput = host.querySelector("#newResourceUrl");
      const label = labelInput.value.trim();
      let url = urlInput.value.trim();
      if (!label || !url) return;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      order.resources = [...(order.resources || []), { label, url }];
      renderPanel();
    });
  }
}

function renderIssueForm(host, order) {
  const formHost = host.querySelector("#issueFormHost");
  formHost.innerHTML = `
    <div class="issue-form">
      <div class="playbook-hint">${t().playbookHint}</div>
      <div class="chip-row">${ISSUE_PLAYBOOK.map((p, idx) => `<button type="button" class="chip" data-prefill="${idx}">${p.title[lang]}</button>`).join("")}</div>
      <input class="text-input" id="issueTitle" placeholder="${t().whatWrong}" style="width:100%;margin-bottom:8px;">
      <div class="field-row">
        <label class="field-label">${t().category}
          <select id="issueCategory">${ISSUE_CATEGORIES.map((c) => `<option value="${c.id}">${c.label[lang]}</option>`).join("")}</select>
        </label>
        <label class="field-label">${t().impact}
          <select id="issueImpact"><option value="low">${t().low}</option><option value="medium" selected>${t().medium}</option><option value="high">${t().high}</option></select>
        </label>
      </div>
      <textarea id="issueFix" rows="2" placeholder="${t().howFix}" style="margin-bottom:8px;"></textarea>
      <input class="text-input" id="issueEscalate" placeholder="${t().whoKnow}" style="width:100%;margin-bottom:10px;">
      <div style="display:flex;gap:8px;">
        <button class="ghost-btn" id="saveIssueBtn" style="background:var(--jade);color:var(--paper);border:none;">${t().logIssue}</button>
        <button class="ghost-btn" id="cancelIssueBtn">${t().cancel}</button>
      </div>
    </div>`;
  formHost.querySelectorAll("[data-prefill]").forEach((chip) => chip.addEventListener("click", () => {
    const p = ISSUE_PLAYBOOK[parseInt(chip.dataset.prefill, 10)];
    formHost.querySelector("#issueTitle").value = p.title[lang];
    formHost.querySelector("#issueCategory").value = p.category;
    formHost.querySelector("#issueImpact").value = p.impact;
    formHost.querySelector("#issueFix").value = p.suggestedFix[lang];
  }));
  formHost.querySelector("#cancelIssueBtn").addEventListener("click", () => { formHost.innerHTML = ""; });
  formHost.querySelector("#saveIssueBtn").addEventListener("click", () => {
    const title = formHost.querySelector("#issueTitle").value.trim();
    if (!title) return;
    ISSUES.unshift({
      id: "i" + (ISSUES.length + 1) + "-" + Date.now().toString(36),
      orderId: order.id,
      category: formHost.querySelector("#issueCategory").value,
      title,
      impact: formHost.querySelector("#issueImpact").value,
      suggestedFix: formHost.querySelector("#issueFix").value.trim(),
      escalateTo: formHost.querySelector("#issueEscalate").value.trim(),
      resolved: false,
      createdAt: new Date().toISOString(),
    });
    renderCurrentView(); renderPanel();
    showToast(lang === "vi" ? "Đã ghi nhận vấn đề" : "Issue logged");
  });
}

function renderNewOrderForm() {
  const formHost = document.getElementById("newOrderFormHost");
  formHost.innerHTML = `
    <div class="issue-form">
      <div class="field-row">
        <input class="text-input" id="newOrderCustomer" placeholder="${t().newOrderCustomer}" style="width:100%;margin-bottom:8px;">
      </div>
      <div class="field-row">
        <input class="text-input" id="newOrderContact" placeholder="${t().newOrderContact}" style="width:100%;margin-bottom:8px;">
      </div>
      <div class="field-row">
        <label class="field-label">${t().newOrderTypeLabel}
          <select class="text-input" id="newOrderType">
            <option value="wholesale">${t().newOrderTypeWholesale}</option>
            <option value="retail">${t().newOrderTypeRetail}</option>
          </select>
        </label>
        <label class="field-label">${t().stage}
          <select class="text-input" id="newOrderStage">${ORDER_STAGES.map((s) => `<option value="${s.id}">${s.label[lang]}</option>`).join("")}</select>
        </label>
      </div>
      <div class="field-row">
        <label class="field-label">${t().newOrderPayment}
          <select class="text-input" id="newOrderPaymentMethod">
            <option value="qr">${t().paymentQr}</option>
            <option value="cash">${t().paymentCash}</option>
          </select>
        </label>
      </div>
      <textarea id="newOrderNote" rows="2" placeholder="${t().newOrderNote}" style="margin-bottom:8px;"></textarea>
      <div style="display:flex;gap:8px;">
        <button class="ghost-btn" id="submitNewOrderBtn" style="background:var(--jade);color:var(--paper);border:none;">${t().createOrder}</button>
      </div>
    </div>`;

  formHost.querySelector("#submitNewOrderBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const customerName = formHost.querySelector("#newOrderCustomer").value.trim();
    const contact = formHost.querySelector("#newOrderContact").value.trim();
    if (!customerName || !contact) return;

    btn.disabled = true;
    try {
      const res = await fetch("/api/ops/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customerName, contact,
          type: formHost.querySelector("#newOrderType").value,
          stage: formHost.querySelector("#newOrderStage").value,
          paymentMethod: formHost.querySelector("#newOrderPaymentMethod").value,
          note: formHost.querySelector("#newOrderNote").value.trim(),
        }),
      });
      if (!res.ok) throw new Error("request_failed");
      const body = await res.json();
      ORDERS.unshift(mapOrderRow(body.order));
      newOrderBannerOpen = false;
      document.getElementById("newOrderBanner").classList.remove("show");
      formHost.innerHTML = "";
      renderCurrentView();
      showToast(t().orderCreated);
    } catch {
      showToast(t().orderCreateFailed);
      btn.disabled = false;
    }
  });
}

/* ---------- Chrome: sidebar, topbar search/filter, new-order banner, lang/theme ---------- */
document.getElementById("hamburgerBtn").addEventListener("click", () => {
  sidebarOpen = !sidebarOpen;
  document.getElementById("sidebar").classList.toggle("open", sidebarOpen);
  document.getElementById("sidebarScrim").classList.toggle("show", sidebarOpen);
});
document.getElementById("sidebarScrim").addEventListener("click", () => {
  sidebarOpen = false;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarScrim").classList.remove("show");
});
document.getElementById("searchInput").addEventListener("input", (e) => { searchQuery = e.target.value; renderCurrentView(); });
document.getElementById("filterSeg").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-filter]");
  if (!btn) return;
  typeFilter = btn.dataset.filter;
  document.querySelectorAll(".filter-seg-btn").forEach((b) => b.classList.toggle("active", b === btn));
  renderCurrentView();
});
document.getElementById("newOrderBtn").addEventListener("click", () => {
  newOrderBannerOpen = !newOrderBannerOpen;
  document.getElementById("newOrderBanner").classList.toggle("show", newOrderBannerOpen);
  if (newOrderBannerOpen) renderNewOrderForm();
});
document.getElementById("newOrderBannerDismiss").addEventListener("click", () => {
  newOrderBannerOpen = false;
  document.getElementById("newOrderBanner").classList.remove("show");
  document.getElementById("newOrderFormHost").innerHTML = "";
});
document.getElementById("themeToggle").addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  document.body.setAttribute("data-theme", theme);
  renderAll();
});

(async () => {
  document.getElementById("viewHost").innerHTML = `<p class="hint">${lang === "vi" ? "Đang tải…" : "Loading…"}</p>`;
  await loadOrders();
  if (ordersLoadError) showToast(t().ordersLoadFailed);
  renderAll();
})();
</script>
