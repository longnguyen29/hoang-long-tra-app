<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Flow — House of Hoàng Long</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark-informed redesign v2 · macrostructure: sidebar ops console (adopted from the
 * user's own "Leaf & Lane Operations" reference mockup — sidebar nav, toolbar with search,
 * table-based Issues, side-by-side Documents panel) · theme: tea-ledger-craft.
 * Brand tokens preserved verbatim from the real app's TOKENS. This version changes the actual
 * page SHAPE, not just its surface — see the shell/topbar/panel/table rules below. */

  :root {
    color-scheme: light;
    --paper: #F7F3EA;
    --paperDeep: #F4EEE1;
    --paperRaised: #FFFDF8;
    --jade: #1C2B24;
    --jadeSoft: #2E4A40;
    --brass: #B08D57;
    --brassDeep: #AD8A4E;
    --lacquer: #9C3B2E;
    --brassOnPaper: #82602D;
    /* Neutral, jade-tinted structural borders — NOT gold. Gold is reserved for meaningful
       accents only (active states, the seal ring, priority-high, the stage spine) so it still
       means something instead of decorating every card, table, and input on the page. */
    --hairline: rgba(28,43,36,0.10);
    --hairlineStrong: rgba(28,43,36,0.20);
    --shadowXs: 0 1px 2px rgba(28,43,36,0.05);
    --shadowSm: 0 2px 10px rgba(28,43,36,0.06), 0 1px 2px rgba(28,43,36,0.04);
    --shadowMd: 0 8px 24px rgba(28,43,36,0.09), 0 2px 6px rgba(28,43,36,0.05);
    --shadowLg: 0 20px 48px rgba(28,43,36,0.16), 0 4px 12px rgba(28,43,36,0.08);
    --focusRing: 0 0 0 3px rgba(173,138,78,0.35);
    --ink: #191512;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper: #191512;
    --paperDeep: #241E19;
    --paperRaised: #2C241D;
    --jade: #F7F3EA;
    --jadeSoft: #D9B876;
    --brass: #D9B876;
    --brassDeep: #D9B876;
    --lacquer: #E0665F;
    --brassOnPaper: #D9B876;
    --hairline: rgba(247,243,234,0.12);
    --hairlineStrong: rgba(247,243,234,0.22);
    --shadowXs: 0 1px 2px rgba(0,0,0,0.25);
    --shadowSm: 0 2px 10px rgba(0,0,0,0.28), 0 1px 2px rgba(0,0,0,0.2);
    --shadowMd: 0 8px 24px rgba(0,0,0,0.36), 0 2px 6px rgba(0,0,0,0.22);
    --shadowLg: 0 24px 56px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.3);
    --focusRing: 0 0 0 3px rgba(217,184,118,0.4);
  }
  :root {
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
    --radius-sm: 7px; --radius-md: 11px; --radius-lg: 16px; --radius-xl: 22px; --radius-full: 999px;
    --ease-out: cubic-bezier(.16,1,.3,1);
    --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 340ms;
    --sidebar-w: 224px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: clip; }
  body {
    background: var(--paper); color: var(--jade);
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
  }
  h1, h2, h3, .display { font-family: 'Lora', Georgia, serif; font-style: normal; }
  a { color: inherit; }
  button { font-family: inherit; }
  ::placeholder { color: var(--jadeSoft); opacity: .55; }
  :focus-visible { outline: none; box-shadow: var(--focusRing); border-radius: var(--radius-sm); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* ---------- Shell: sidebar + main, adopted from the reference mockup ---------- */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-w); flex: none; background: var(--paperDeep); border-right: 1px solid var(--hairline);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
  .sidebar-seal {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--brassDeep); background: color-mix(in oklab, var(--brass) 10%, var(--paperRaised));
    box-shadow: inset 0 0 0 1.5px var(--brassDeep), inset 0 0 0 3px var(--paper);
  }
  .sidebar-brand-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
  .sidebar-brand-sub { font-size: 10px; color: var(--brassOnPaper); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .nav-list { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--radius-md);
    border: none; background: none; cursor: pointer; color: var(--jadeSoft); font-size: 13px; font-weight: 600;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .nav-item:hover { background: color-mix(in srgb, var(--brass) 10%, transparent); color: var(--jade); }
  .nav-item.active { background: var(--jade); color: var(--paper); box-shadow: var(--shadowSm); }
  .nav-ico { flex: none; width: 18px; display: flex; align-items: center; justify-content: center; opacity: .85; }
  .nav-item.active .nav-ico { opacity: 1; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count { font-size: 10.5px; font-weight: 700; color: var(--jadeSoft); background: var(--paperDeep); border-radius: var(--radius-full); min-width: 19px; height: 19px; padding: 0 5px; display: flex; align-items: center; justify-content: center; flex: none; }
  .nav-item.active .nav-count { background: color-mix(in srgb, var(--paper) 18%, transparent); color: var(--paper); }
  .sidebar-foot { display: flex; gap: 6px; padding: 12px 8px 4px; border-top: 1px solid var(--hairline); margin-top: 8px; }

  .hamburger-btn {
    display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: var(--paperDeep); border: 1px solid var(--hairline); cursor: pointer; flex: none; color: var(--jade);
  }
  .sidebar-scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 75; }
  .sidebar-scrim.show { display: block; }

  @media (max-width: 880px) {
    .hamburger-btn { display: flex; }
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 80; width: 250px;
      transform: translateX(-104%); transition: transform var(--dur-base) var(--ease-out); box-shadow: var(--shadowLg);
    }
    .sidebar.open { transform: translateX(0); }
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- Topbar: title/breadcrumb + search + filter + new order + lang/theme ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(6px); padding: 16px 5vw; border-bottom: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-crumb { font-size: 11px; color: var(--jadeSoft); margin: 0 0 2px; }
  .topbar-title { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .search-wrap { position: relative; }
  .search-ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; opacity: .55; pointer-events: none; }
  .search-input {
    font-size: 12.5px; padding: 8px 12px 8px 30px; border-radius: var(--radius-full); border: 1px solid var(--hairline);
    background: var(--paperDeep); color: var(--jade); width: 170px; transition: border-color var(--dur-fast) var(--ease-out), width var(--dur-base) var(--ease-out);
  }
  .search-input:focus-visible { border-color: var(--brassDeep); width: 210px; }
  .search-wrap .search-input { padding: 8px 12px 8px 30px; }
  .filter-seg { display: flex; gap: 2px; padding: 3px; background: var(--paperDeep); border: 1px solid var(--hairline); border-radius: var(--radius-full); }
  .filter-seg-btn { border: none; background: transparent; color: var(--jadeSoft); border-radius: var(--radius-full); padding: 7px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .filter-seg-btn:hover { color: var(--jade); }
  .filter-seg-btn.active { background: var(--jade); color: var(--paper); }
  .btn-primary {
    display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 9px 15px; border-radius: var(--radius-full);
    border: none; background: var(--jade); color: var(--paper); cursor: pointer; white-space: nowrap;
    transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .btn-primary:hover { box-shadow: var(--shadowMd); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .pill-controls { display: flex; gap: 2px; padding: 3px; background: var(--paperDeep); border: 1px solid var(--hairline); border-radius: var(--radius-full); }
  .pill-btn {
    border: none; background: transparent; color: var(--jadeSoft); border-radius: var(--radius-full); padding: 8px 13px;
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .pill-btn:hover { color: var(--jade); background: color-mix(in oklab, var(--brass) 12%, transparent); }

  .new-order-banner {
    display: none; align-items: flex-start; gap: 10px; margin: 14px 5vw 0; padding: 12px 14px; border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--brass) 12%, var(--paperDeep)); border: 1px solid var(--hairlineStrong);
  }
  .new-order-banner.show { display: flex; }
  .new-order-banner .body { flex: 1; font-size: 12.5px; color: var(--jadeSoft); line-height: 1.55; }
  .new-order-banner .title { font-weight: 700; color: var(--brassOnPaper); margin-bottom: 2px; font-size: 12.5px; }
  .new-order-banner button { flex: none; font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: var(--radius-sm); border: 1px solid var(--hairlineStrong); background: var(--paperRaised); color: var(--jade); cursor: pointer; }

  main.content { padding: 18px 5vw 0; max-width: 1300px; margin: 0 auto; width: 100%; }
  .hint-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 14px; }
  .hint { font-size: 11.5px; color: var(--jadeSoft); margin: 0; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--jadeSoft); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; }

  .priority-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .priority-dot.high { background: var(--lacquer); }
  .priority-dot.new { background: var(--brassDeep); }
  .priority-dot.onTrack { background: var(--jadeSoft); opacity: .55; }

  .board { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 16px; }
  .col { flex: 0 0 240px; background: var(--paperDeep); border-radius: var(--radius-lg); padding: 3px 10px 10px; max-height: 68vh; display: flex; flex-direction: column; box-shadow: var(--shadowSm); border: 1px solid var(--hairline); overflow: hidden; }
  .col-spine { height: 3px; margin: 0 -10px 9px; flex: none; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px; border-bottom: 1px solid var(--hairline); margin-bottom: 9px; }
  .col-title { font-size: 12.5px; font-weight: 700; flex: 1; letter-spacing: -.005em; }
  .col-count { font-size: 10.5px; font-weight: 700; color: var(--brassOnPaper); background: var(--paperRaised); border-radius: var(--radius-full); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--hairlineStrong); }
  .col-body { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 1px 1px 4px; mask-image: linear-gradient(to bottom, transparent, black 10px, black calc(100% - 10px), transparent); }
  .col-empty { font-size: 11.5px; color: var(--jadeSoft); opacity: .55; padding: 10px 4px; text-align: center; }
  @media (max-width: 720px) {
    .board { flex-direction: column; overflow-x: visible; gap: 14px; }
    .col { flex: none; width: 100%; max-height: none; }
    .col-body { overflow-y: visible; max-height: none; mask-image: none; }
  }

  .card {
    display: block; width: 100%; text-align: left; background: var(--paper); border-radius: var(--radius-md); padding: 11px 12px;
    cursor: pointer; border: 1px solid var(--hairline); box-shadow: var(--shadowXs); position: relative;
    transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadowMd); border-color: var(--hairlineStrong); }
  .card:active { transform: translateY(-1px) scale(.995); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .type-badge { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .type-badge.retail { color: var(--jadeSoft); }
  .type-badge.wholesale { color: var(--brassOnPaper); }
  .card-flags { display: flex; align-items: center; gap: 7px; }
  .issue-flag { display: flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--lacquer); }
  .card-id-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-top: 9px; }
  .card-name { font-size: 13px; font-weight: 600; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { font-size: 11px; color: var(--jadeSoft); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .card-priority { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; flex: none; }
  .card-priority.high { color: var(--lacquer); }
  .card-priority.new { color: var(--brassOnPaper); }
  .card-priority.onTrack { color: var(--jadeSoft); opacity: .7; font-weight: 600; }

  footer.app-footer { margin: 30px 5vw 0; padding: 18px 0 26px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--jadeSoft); max-width: 1300px; margin-left: auto; margin-right: auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ---------- Detail panel: right-anchored slide-over (was a centered modal) ---------- */
  .panel-overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 55%, transparent); backdrop-filter: blur(1.5px); z-index: 60; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100%); background: var(--paperRaised);
    box-shadow: var(--shadowLg); overflow-y: auto; border-left: 1px solid var(--hairline);
    transform: translateX(100%); transition: transform var(--dur-slow) var(--ease-out);
  }
  .panel.shown { transform: translateX(0); }
  .panel.no-anim { transition: none; transform: translateX(0); }
  .panel-topbar { height: 3px; background: linear-gradient(90deg, var(--jadeSoft), var(--brassDeep)); position: sticky; top: 0; z-index: 2; }
  .panel-head { padding: 18px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .panel-crumb { font-size: 11px; color: var(--jadeSoft); margin: 0 0 6px; }
  .panel-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel-title { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .status-pill { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-full); text-transform: uppercase; letter-spacing: .03em; }
  .status-pill.inprogress { background: color-mix(in srgb, var(--brass) 20%, transparent); color: var(--brassOnPaper); }
  .status-pill.done { background: color-mix(in srgb, var(--jadeSoft) 20%, transparent); color: var(--jadeSoft); }
  .panel-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn { background: var(--paperDeep); border: 1px solid var(--hairline); border-radius: var(--radius-sm); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .icon-btn:hover { border-color: var(--brassDeep); }
  .icon-btn:active { transform: scale(.92); }

  .meta-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; padding: 16px 24px 0; }
  @media (max-width: 620px) { .meta-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .meta-item { background: var(--paperDeep); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: 9px 11px; min-width: 0; }
  .meta-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--jadeSoft); margin-bottom: 3px; }
  .meta-value { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .stepper-row { display: flex; align-items: center; gap: 10px; padding: 16px 24px 0; }
  .stepper-col { flex: 1; min-width: 0; }
  .stepper-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--jadeSoft); margin: 0 0 8px; }
  .stepper { display: flex; align-items: center; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .step-btn { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 7px 11px 7px 9px; border-radius: var(--radius-full); cursor: pointer; white-space: nowrap; border: 1px solid var(--hairline); background: var(--paperDeep); color: var(--jadeSoft); transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
  .step-btn .step-ico { display: flex; align-items: center; }
  .step-btn:hover { border-color: var(--brassDeep); }
  .step-btn.done { color: var(--brassOnPaper); border-color: transparent; background: color-mix(in srgb, var(--brass) 16%, transparent); }
  .step-btn.active { background: var(--jade); color: var(--paper); font-weight: 700; border-color: transparent; box-shadow: var(--shadowSm); }
  .mark-complete-btn { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 9px 14px; border-radius: var(--radius-full); border: none; background: var(--jade); color: var(--paper); cursor: pointer; white-space: nowrap; transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  .mark-complete-btn:hover { box-shadow: var(--shadowMd); transform: translateY(-1px); }

  .quick-actions { display: flex; gap: 8px; padding: 14px 24px 0; }
  .quick-btn { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 7px 13px 7px 7px; border-radius: var(--radius-full); cursor: pointer; border: 1px solid var(--hairline); background: var(--paperDeep); color: var(--jade); text-decoration: none; transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
  .quick-btn .ico { width: 22px; height: 22px; border-radius: 50%; background: var(--paperRaised); display: flex; align-items: center; justify-content: center; color: var(--brassOnPaper); box-shadow: inset 0 0 0 1px var(--hairlineStrong); }
  .quick-btn:hover { border-color: var(--brassDeep); box-shadow: var(--shadowXs); transform: translateY(-1px); }
  .quick-actions-empty { font-size: 11.5px; color: var(--jadeSoft); opacity: .7; padding: 0 24px; margin-top: 8px; }

  .tabs { display: flex; gap: 2px; padding: 18px 24px 0; border-bottom: 1px solid var(--hairline); overflow-x: auto; }
  .tab-btn { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 8px 12px 10px; background: none; border: none; cursor: pointer; color: var(--jadeSoft); border-bottom: 2px solid transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0; flex: 0 0 auto; white-space: nowrap; transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
  .tab-btn:hover { color: var(--jade); background: color-mix(in srgb, var(--brass) 8%, transparent); }
  .tab-btn.active { color: var(--jade); border-bottom-color: var(--brassDeep); background: color-mix(in srgb, var(--brass) 10%, transparent); }
  .tab-badge { background: var(--lacquer); color: var(--paper); border-radius: var(--radius-full); font-size: 10px; font-weight: 700; padding: 1px 6px; }
  .tab-body { padding: 20px 24px 28px; }

/* ---------- Orders — loaded from Supabase via /api/ops/orders, see loadOrders() near the
 * bottom of this script. Empty until that first load resolves. ---------- */
let ORDERS = [];
let ordersLoadError = null;

function mapOrderRow(row) {
  return {
    id: row.id, type: row.type, customerName: row.customer_name, contact: row.contact,
    lines: row.lines || [], totalKg: row.total_kg ?? undefined, totalItems: row.total_items ?? undefined,
    tier: row.tier ?? undefined, estimatedTotal: row.estimated_total ?? undefined,
    taxNumber: row.tax_number || "", note: row.note || "", trackingCode: row.tracking_code || "",
    stage: row.stage, stageChecklist: {}, unread: row.unread, resources: [], docLog: [],
  };
}

async function loadOrders() {
  ordersLoadError = null;
  try {
    const res = await fetch("/api/ops/orders");
    if (!res.ok) throw new Error("request_failed");
    const body = await res.json();
    ORDERS = (body.orders || []).map(mapOrderRow);
  } catch {
    ordersLoadError = true;
  }
}

// Mutates locally first for instant feedback (matches every other in-place order edit in this
// file), then persists — a failed PATCH surfaces as a toast rather than silently reverting,
// since this is a single shared-PIN tool with no per-user undo/retry queue to build against.
function setOrderStage(order, stage) {
  order.stage = stage;
  fetch(`/api/ops/orders/${order.id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stage }),
  }).then((res) => {
    if (!res.ok) throw new Error("request_failed");
  }).catch(() => showToast(t().stageSaveFailed));
}

// Server side archives the row into deleted_records before deleting it (recoverable there
// for 7 days, same as a delete from the real /admin dashboard) — see the DELETE handler in
// app/api/ops/orders/[id]/route.js.
async function removeOrder(order) {
  if (!confirm(t().removeOrderConfirm.replace("{name}", order.customerName))) return;
  try {
    const res = await fetch(`/api/ops/orders/${order.id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("request_failed");
    ORDERS = ORDERS.filter((o) => o.id !== order.id);
    openOrderId = null;
    renderCurrentView();
    renderPanel();
    showToast(t().orderRemoved);
  } catch {
    showToast(t().orderRemoveFailed);
  }
}

// Ad-hoc tasks that aren't tied to any one order's checklist — e.g. "restock boxes", "call the
// courier about next week". Real order-stage checklist items also show up in the Tasks view
// (derived below), so this list only holds tasks that don't belong to a specific order.
let STANDALONE_TASKS = [];

// Example starter team — clearly marked as example data. There's no login system here, so
// "acting as" a worker (picked in the Tasks view) stands in for a real auth session, letting
// self-assignment ("apply for a task") and proof-of-process uploads be attributed to someone.
let WORKERS = [
  { id: "w-minh", name: "Minh", example: true },
  { id: "w-lan", name: "Lan", example: true },
  { id: "w-duc", name: "Đức", example: true },
];
let currentWorkerId = WORKERS[0].id;
function workerName(id) {
  const w = WORKERS.find((w2) => w2.id === id);
  return w ? w.name : null;
}

// Resolves a task's id+source back to a live read/write handle on the underlying object — either
// a STANDALONE_TASKS entry, or one item inside an order's stage checklist (which has to be
// re-saved as a whole array via saveChecklist, unlike the standalone list).
function findTaskRef(id, source) {
  if (source === "checklist") {
    const sep = id.lastIndexOf("__");
    const orderId = id.slice(0, sep), idx = Number(id.slice(sep + 2));
    const order = ORDERS.find((o) => o.id === orderId);
    if (!order) return null;
    const items = effectiveChecklist(order);
    if (!items[idx]) return null;
    return { get: () => items[idx], set: (patch) => { items[idx] = { ...items[idx], ...patch }; saveChecklist(order, items); } };
  }
  const tk = STANDALONE_TASKS.find((s) => s.id === id);
  if (!tk) return null;
  return { get: () => tk, set: (patch) => Object.assign(tk, patch) };
}
function claimTask(id, source) {
  const ref = findTaskRef(id, source);
  if (!ref) return;
  const tk = ref.get();
  if (tk.assigneeId) return;
  ref.set({ assigneeId: currentWorkerId });
  renderCurrentView(); renderSidebar();
}
function releaseTask(id, source) {
  const ref = findTaskRef(id, source);
  if (!ref) return;
  const tk = ref.get();
  if (tk.assigneeId !== currentWorkerId) return;
  ref.set({ assigneeId: null });
  renderCurrentView(); renderSidebar();
}
function addProofToTask(id, source, files) {
  const ref = findTaskRef(id, source);
  if (!ref) return;
  const tk = ref.get();
  const added = Array.from(files).map((f) => ({
    name: f.name, url: URL.createObjectURL(f), type: f.type,
    uploadedBy: currentWorkerId, uploadedAt: new Date(),
  }));
  ref.set({ proof: [...(tk.proof || []), ...added] });
  renderCurrentView();
}
function removeProofFromTask(id, source, proofIdx) {
  const ref = findTaskRef(id, source);
  if (!ref) return;
  const tk = ref.get();
  const proof = [...(tk.proof || [])];
  proof.splice(proofIdx, 1);
  ref.set({ proof });
  renderCurrentView();
}

// Tasks derived from real, in-progress checklist items across all orders — not invented, just
// surfaced in one place. Each carries enough to jump back to its order.
function getAllTasks() {
  const fromChecklists = ORDERS.flatMap((o) => {
    const stageLabel = ORDER_STAGES.find((s) => s.id === o.stage)?.label[lang] || o.stage;
    return effectiveChecklist(o).map((it, idx) => ({
      id: `${o.id}__${idx}`, source: "checklist", orderId: o.id, orderName: o.customerName,
      stageLabel, idx, label: it.label, done: it.done, assigneeId: it.assigneeId || null, proof: it.proof || [],
    }));
  });
  const standalone = STANDALONE_TASKS.map((t2) => ({ ...t2, source: "standalone", assigneeId: t2.assigneeId || null, proof: t2.proof || [] }));
  return [...fromChecklists, ...standalone];
}
function toggleOrderChecklistItem(orderId, idx) {
  const order = ORDERS.find((o) => o.id === orderId);
  if (!order) return;
  const items = effectiveChecklist(order);
  items[idx] = { ...items[idx], done: !items[idx].done };
  saveChecklist(order, items);
}

// Documents and linked resources, aggregated across every order — real entries only, generated
// from the same docLog/resources each order already tracks.
function allDocLogEntries() {
  return ORDERS.flatMap((o) => (o.docLog || []).map((d) => ({ ...d, orderId: o.id, orderName: o.customerName })))
    .sort((a, b) => b.at - a.at);
}
function allResourceEntries() {
  return ORDERS.flatMap((o) => (o.resources || []).map((r, idx) => ({ ...r, orderId: o.id, orderName: o.customerName, idx })));
}

// Contacts deduped from real orders — one row per unique phone/email on file.
function allContacts() {
  const map = new Map();
  ORDERS.forEach((o) => {
    if (!o.contact) return;
    if (!map.has(o.contact)) map.set(o.contact, { contact: o.contact, name: o.customerName, type: o.type, orderIds: [o.id] });
    else map.get(o.contact).orderIds.push(o.id);
  });
  return [...map.values()];
}

function icon(name, size) {
  const s = size || 15;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none">${ICON_PATHS[name] || ""}</svg>`;
}
// Best-effort guess at how to reach a customer from the free-text `contact` field
// (phone numbers and emails are both stored there as plain text, real app does the same).
function contactKind(contact) {
  const c = (contact || "").trim();
  if (!c) return null;
  if (c.includes("@")) return "email";
  if (/[\d+]/.test(c)) return "phone";
  return null;
}
function logDoc(order, kind, action) {
  order.docLog = order.docLog || [];
  order.docLog.unshift({ kind, action, at: new Date() });
}
// Priority is derived from real state, not invented: an open high-impact issue outranks
// "unread", which outranks "on track" — mirrors the mockup's priority dots honestly.
function orderPriority(order) {
  const hasHighIssue = ISSUES.some((i) => i.orderId === order.id && !i.resolved && i.impact === "high");
  if (hasHighIssue) return "high";
  if (order.unread) return "new";
  return "onTrack";
}
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(showToast._t); showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------- Document templates — identical markup/copy to lib/documents.js in the real
   codebase, so a printed invoice from here looks exactly like one printed from the app. ---------- */
const DOC_STYLE = `
  body{font-family:Georgia,serif;color:#1C2B24;padding:40px;max-width:600px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;}
  .seal{width:48px;height:48px;border-radius:50%;border:1.5px solid #AD8A4E;display:flex;align-items:center;justify-content:center;font-size:18px;color:#AD8A4E;margin-bottom:12px;}
  .brand{font-size:22px;font-weight:600;margin-bottom:2px;}
  .meta{font-size:13px;color:#2E4A40;margin-bottom:24px;}
  hr{border:none;border-top:1px solid #AD8A4E55;margin:16px 0;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:0.5px;color:#AD8A4E;margin:0 0 10px;}
`;
function buildInvoiceHtml(order) {
  const itemRows = order.lines.map((l) =>
    `<tr><td style="padding:8px 0;">${esc(l.name.en)}${l.price ? ` <span style="color:#AD8A4E;">(${l.price.toLocaleString("vi-VN")}đ)</span>` : ""}</td>
     <td style="padding:8px 0;text-align:right;">${l.qty} ${l.unit === "kg" ? "kg" : l.unit === "pack" ? "pack" : "pcs"}${l.price ? ` = ${(l.price * l.qty).toLocaleString("vi-VN")}đ` : ""}</td></tr>`
  ).join("");
  const totalLine = order.type === "retail"
    ? `<tr><td style="padding:10px 0;font-weight:700;">Total items</td><td style="padding:10px 0;text-align:right;font-weight:700;">${order.totalItems} pcs</td></tr>`
    : `<tr><td style="padding:10px 0;font-weight:700;">Total volume</td><td style="padding:10px 0;text-align:right;font-weight:700;">${order.totalKg} kg</td></tr>
       <tr><td colspan="2" style="padding:2px 0 10px;color:#AD8A4E;">${esc(order.tier.range.en)} · ${esc(order.tier.off.en)}</td></tr>`;
  const estLine = order.estimatedTotal
    ? `<tr><td style="padding:6px 0;font-weight:700;color:#AD8A4E;">Estimated total</td><td style="padding:6px 0;text-align:right;font-weight:700;color:#AD8A4E;">${order.estimatedTotal.toLocaleString("vi-VN")}đ</td></tr>` : "";
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Invoice ${esc(order.id)}</title><style>${DOC_STYLE}</style></head>
    <body>
      <div class="seal">皇龍</div>
      <div class="brand">House of Hoàng Long</div>
      <div class="meta">Invoice · Order ${esc(order.id)}<br/>${esc(new Date().toLocaleString("vi-VN"))}</div>
      <hr/>
      <h2>Customer</h2>
      <p style="font-size:14px;line-height:1.7;margin:0 0 16px;">${esc(order.customerName)}<br/>${esc(order.contact)}${order.taxNumber ? `<br/>Tax No: ${esc(order.taxNumber)}` : ""}</p>
      <h2>Items</h2>
      <table>${itemRows}${totalLine}${estLine}</table>
      ${order.note ? `<p style="font-size:13px;font-style:italic;color:#2E4A40;margin-top:16px;">Note: ${esc(order.note)}</p>` : ""}
      <hr/>
      <p style="font-size:11px;color:#2E4A40;">This is a preliminary invoice. Final pricing is confirmed by our team.</p>
    </body></html>`;
}
function buildPackingSlipHtml(order) {
  const itemRows = order.lines.map((l) =>
    `<tr><td style="padding:8px 0;width:24px;"><span style="display:inline-block;width:14px;height:14px;border:1.5px solid #AD8A4E;border-radius:3px;"></span></td>
     <td style="padding:8px 0;">${esc(l.name.en)}</td><td style="padding:8px 0;text-align:right;">${l.qty} ${l.unit === "kg" ? "kg" : l.unit === "pack" ? "pack" : "pcs"}</td></tr>`
  ).join("");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Packing Slip ${esc(order.id)}</title><style>${DOC_STYLE}</style></head>
    <body>
      <div class="seal">皇龍</div>
      <div class="brand">House of Hoàng Long</div>
      <div class="meta">Packing Slip · Order ${esc(order.id)}<br/>${esc(new Date().toLocaleString("vi-VN"))}</div>
      <hr/>
      <h2>Ship to</h2>
      <p style="font-size:14px;line-height:1.7;margin:0 0 16px;">${esc(order.customerName)}<br/>${esc(order.contact)}</p>
      <h2>Items to pack</h2>
      <table>${itemRows}</table>
      <hr/>
      <h2>Tracking code</h2>
      <p style="font-size:14px;">${order.trackingCode ? esc(order.trackingCode) : "_________________________"}</p>
      ${order.note ? `<p style="font-size:13px;font-style:italic;color:#2E4A40;margin-top:16px;">Note: ${esc(order.note)}</p>` : ""}
      <hr/>
      <p style="font-size:11px;color:#2E4A40;">Internal document — not shown to the customer.</p>
    </body></html>`;
}
function printHtml(html) {
  const win = window.open("", "_blank", "width=700,height=900");
  if (!win) return;
  win.document.write(html); win.document.close(); win.focus();
  setTimeout(() => win.print(), 350);
}

function matchesFilters(o) {
  if (typeFilter !== "all" && o.type !== typeFilter) return false;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    if (!o.customerName.toLowerCase().includes(q) && !o.id.toLowerCase().includes(q)) return false;
  }
  return true;
}
function matchesSearch(text) {
  const q = searchQuery.trim().toLowerCase();
  if (!q) return true;
  return String(text || "").toLowerCase().includes(q);
}

function openOrder(id) {
  openOrderId = id; activeTab = "checklist"; activeIssueCategory = "all"; docModalKind = "invoice"; renderPanel();
}

function renderOrderFlowView() {
  const host = document.getElementById("viewHost");
  host.innerHTML = `<div class="board" id="board"></div>`;
  const board = document.getElementById("board");
  ORDER_STAGES.forEach((stage, stageIdx) => {
    const stageOrders = ORDERS.filter((o) => o.stage === stage.id && matchesFilters(o)).slice().reverse();
    // Spine color walks jade → brass across the seven stages, so the column itself hints at
    // how far along the flow it sits — real information, not decoration.
    const pct = ORDER_STAGES.length > 1 ? (stageIdx / (ORDER_STAGES.length - 1)) * 100 : 0;
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `
      <div class="col-spine" style="background:color-mix(in oklab, var(--brassDeep) ${pct}%, var(--jadeSoft))"></div>
      <div class="col-head">
        <span class="col-title">${stage.label[lang]}</span>
        <span class="col-count">${stageOrders.length}</span>
      </div>
      <div class="col-body">
        ${stageOrders.map((o) => {
          const openIssues = ISSUES.filter((i) => i.orderId === o.id && !i.resolved).length;
          const totalLine = o.type === "retail"
            ? `${icon("package", 12)} ${o.totalItems || 0} ${t().pcs}`
            : `${icon("leaf", 12)} ${o.totalKg || 0} ${t().kg}`;
          const pr = orderPriority(o);
          const prLabel = t()["priority" + pr.charAt(0).toUpperCase() + pr.slice(1)];
          return `<button type="button" class="card ${o.type}" data-open="${o.id}">
            <div class="card-top">
              <span class="type-badge ${o.type}">${o.type === "retail" ? t().retail : t().wholesale}</span>
              <span class="card-flags">
                ${openIssues > 0 ? `<span class="issue-flag">${icon("alert-triangle", 11)} ${openIssues}</span>` : ""}
              </span>
            </div>
            <div class="card-id-row">
              <span class="card-name">${esc(o.customerName)}</span>
              <span class="card-priority ${pr}"><span class="priority-dot ${pr}"></span>${prLabel}</span>
            </div>
            <div class="card-meta">${totalLine}</div>
          </button>`;
        }).join("") || `<div class="col-empty">—</div>`}
      </div>`;
    board.appendChild(col);
  });
  board.querySelectorAll("[data-open]").forEach((el) => el.addEventListener("click", () => openOrder(el.dataset.open)));
}

/* ---------- Other sidebar sections — each a real view over real (or clearly-marked example)
   data, not a faked page. ---------- */
function renderCurrentView() {
  if (currentView === "flowmap") renderFlowMapView();
  else if (currentView === "orders") renderOrdersView();
  else if (currentView === "tasks") renderTasksView();
  else if (currentView === "issues") renderIssuesMasterView();
  else if (currentView === "inventory") renderInventoryView();
  else if (currentView === "documents") renderDocumentsMasterView();
  else if (currentView === "reports") renderReportsView();
  else if (currentView === "templates") renderTemplatesView();
  else if (currentView === "contacts") renderContactsView();
  else if (currentView === "settings") renderSettingsView();
  else renderOrderFlowView();
}

/* ---------- Flow Map: the order flow's stages, top to bottom, editable in place. Stage data
   (ORDER_STAGES / STAGE_CHECKLIST_DEFAULTS / STAGE_GUIDE / STAGE_ICONS) is the same shared state
   the Order Flow board, the panel stepper, Templates, and Reports all read from — so an edit here
   shows up the instant you switch to any other tab, no export/import step needed. ---------- */
function slugify(s) {
  return String(s || "step").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "step";
}
function uniqueStageId(base) {
  let id = slugify(base), i = 2;
  while (ORDER_STAGES.some((s) => s.id === id)) { id = slugify(base) + "_" + i; i++; }
  return id;
}

function flowNodeHtml(stage, idx) {
  const checklist = STAGE_CHECKLIST_DEFAULTS[stage.id] || [];
  const guide = STAGE_GUIDE[stage.id] || { steps: [], keyPoint: { en: "", vi: "" } };
  const reqDocs = STAGE_REQUIRED_DOCS[stage.id] || [];
  const inUse = ORDERS.some((o) => o.stage === stage.id);
  return `
  <div class="flowmap-node" data-stage="${stage.id}">
    <div class="flowmap-node-head">
      <span class="flowmap-node-ico">${icon(STAGE_ICONS[stage.id] || "edit", 15)}</span>
      <div class="flowmap-node-labels">
        <input class="text-input flowmap-label-input" data-editlabel="${stage.id}" data-lang="en" value="${esc(stage.label.en)}" placeholder="Stage name">
      </div>
      <div class="flowmap-node-controls">
        <button type="button" class="icon-btn" data-moveup="${stage.id}" title="${t().moveUp}" ${idx === 0 ? "disabled" : ""}>${icon("arrow-up", 14)}</button>
        <button type="button" class="icon-btn" data-movedown="${stage.id}" title="${t().moveDown}" ${idx === ORDER_STAGES.length - 1 ? "disabled" : ""}>${icon("arrow-down", 14)}</button>
        <button type="button" class="icon-btn" data-deletestage="${stage.id}" title="${inUse ? t().stageInUse : t().remove}" ${inUse ? "disabled" : ""}>${icon("trash", 14)}</button>
      </div>
    </div>
    <div class="flowmap-node-body">
      <div class="flowmap-sub">
        <div class="section-label">${t().checklist}</div>
        ${checklist.map((it, i2) => `
          <div class="flowmap-item-row">
            <input class="text-input" data-checklistedit="${stage.id}" data-idx="${i2}" data-lang="en" value="${esc(it.en)}" placeholder="Checklist item">
            <button type="button" class="resource-remove" data-checklistremove="${stage.id}" data-idx="${i2}" title="${t().remove}">${icon("x", 13)}</button>
          </div>`).join("")}
        <button type="button" class="ghost-btn" data-checklistadd="${stage.id}">+ ${t().addItem}</button>
      </div>
      <div class="flowmap-sub">
        <div class="section-label">${t().guide}</div>
        ${guide.steps.map((s, i2) => `
          <div class="flowmap-item-row">
            <input class="text-input" data-guideedit="${stage.id}" data-idx="${i2}" data-lang="en" value="${esc(s.en)}" placeholder="Guide step">
            <button type="button" class="resource-remove" data-guideremove="${stage.id}" data-idx="${i2}" title="${t().remove}">${icon("x", 13)}</button>
          </div>`).join("")}
        <button type="button" class="ghost-btn" data-guideadd="${stage.id}">+ ${t().addItem}</button>
        <div class="section-label" style="margin-top:12px;">${t().keyPoint}</div>
        <div class="flowmap-item-row">
          <input class="text-input" data-keypointedit="${stage.id}" data-lang="en" value="${esc(guide.keyPoint.en || "")}" placeholder="Key point">
        </div>
      </div>
    </div>
    <div class="flowmap-legal">
      <div class="section-label legal"><span class="legal-ico">${icon("alert-triangle", 12)}</span>${t().reqDocsLabel}</div>
      ${reqDocs.map((d, i2) => `
        <div class="flowmap-item-row">
          <input class="text-input" data-reqdocedit="${stage.id}" data-idx="${i2}" data-lang="en" value="${esc(d.en)}" placeholder="Required document">
          <button type="button" class="resource-remove" data-reqdocremove="${stage.id}" data-idx="${i2}" title="${t().remove}">${icon("x", 13)}</button>
        </div>`).join("")}
      <button type="button" class="ghost-btn" data-reqdocadd="${stage.id}">+ ${t().addItem}</button>
    </div>
  </div>`;
}

function wireFlowMapEvents(host) {
  host.querySelectorAll("[data-editlabel]").forEach((inp) => inp.addEventListener("change", () => {
    const stage = ORDER_STAGES.find((s) => s.id === inp.dataset.editlabel);
    if (stage) stage.label[inp.dataset.lang] = inp.value;
    renderSidebar(); renderCurrentView(); renderPanel();
  }));

  host.querySelectorAll("[data-moveup]").forEach((b) => b.addEventListener("click", () => {
    const idx = ORDER_STAGES.findIndex((s) => s.id === b.dataset.moveup);
    if (idx > 0) { const [s] = ORDER_STAGES.splice(idx, 1); ORDER_STAGES.splice(idx - 1, 0, s); renderCurrentView(); renderPanel(); }
  }));
  host.querySelectorAll("[data-movedown]").forEach((b) => b.addEventListener("click", () => {
    const idx = ORDER_STAGES.findIndex((s) => s.id === b.dataset.movedown);
    if (idx < ORDER_STAGES.length - 1) { const [s] = ORDER_STAGES.splice(idx, 1); ORDER_STAGES.splice(idx + 1, 0, s); renderCurrentView(); renderPanel(); }
  }));
  host.querySelectorAll("[data-deletestage]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.deletestage;
    if (ORDERS.some((o) => o.stage === id)) { showToast(t().stageInUse); return; }
    const idx = ORDER_STAGES.findIndex((s) => s.id === id);
    if (idx !== -1) ORDER_STAGES.splice(idx, 1);
    delete STAGE_CHECKLIST_DEFAULTS[id]; delete STAGE_GUIDE[id]; delete STAGE_ICONS[id]; delete STAGE_REQUIRED_DOCS[id];
    renderSidebar(); renderCurrentView(); renderPanel();
  }));

  host.querySelectorAll("[data-checklistedit]").forEach((inp) => inp.addEventListener("change", () => {
    const list = STAGE_CHECKLIST_DEFAULTS[inp.dataset.checklistedit];
    if (list) list[Number(inp.dataset.idx)][inp.dataset.lang] = inp.value;
  }));
  host.querySelectorAll("[data-checklistadd]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.checklistadd;
    STAGE_CHECKLIST_DEFAULTS[id] = STAGE_CHECKLIST_DEFAULTS[id] || [];
    STAGE_CHECKLIST_DEFAULTS[id].push({ en: "", vi: "" });
    renderCurrentView();
  }));
  host.querySelectorAll("[data-checklistremove]").forEach((b) => b.addEventListener("click", () => {
    const list = STAGE_CHECKLIST_DEFAULTS[b.dataset.checklistremove];
    if (list) list.splice(Number(b.dataset.idx), 1);
    renderCurrentView();
  }));

  host.querySelectorAll("[data-guideedit]").forEach((inp) => inp.addEventListener("change", () => {
    const g = STAGE_GUIDE[inp.dataset.guideedit];
    if (g) g.steps[Number(inp.dataset.idx)][inp.dataset.lang] = inp.value;
  }));
  host.querySelectorAll("[data-guideadd]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.guideadd;
    STAGE_GUIDE[id] = STAGE_GUIDE[id] || { steps: [], keyPoint: { en: "", vi: "" } };
    STAGE_GUIDE[id].steps.push({ en: "", vi: "" });
    renderCurrentView();
  }));
  host.querySelectorAll("[data-guideremove]").forEach((b) => b.addEventListener("click", () => {
    const g = STAGE_GUIDE[b.dataset.guideremove];
    if (g) g.steps.splice(Number(b.dataset.idx), 1);
    renderCurrentView();
  }));
  host.querySelectorAll("[data-keypointedit]").forEach((inp) => inp.addEventListener("change", () => {
    const g = STAGE_GUIDE[inp.dataset.keypointedit];
    if (g) { g.keyPoint = g.keyPoint || { en: "", vi: "" }; g.keyPoint[inp.dataset.lang] = inp.value; }
  }));

  host.querySelectorAll("[data-reqdocedit]").forEach((inp) => inp.addEventListener("change", () => {
    const list = STAGE_REQUIRED_DOCS[inp.dataset.reqdocedit];
    if (list) list[Number(inp.dataset.idx)][inp.dataset.lang] = inp.value;
  }));
  host.querySelectorAll("[data-reqdocadd]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.reqdocadd;
    STAGE_REQUIRED_DOCS[id] = STAGE_REQUIRED_DOCS[id] || [];
    STAGE_REQUIRED_DOCS[id].push({ en: "", vi: "" });
    renderCurrentView();
  }));
  host.querySelectorAll("[data-reqdocremove]").forEach((b) => b.addEventListener("click", () => {
    const list = STAGE_REQUIRED_DOCS[b.dataset.reqdocremove];
    if (list) list.splice(Number(b.dataset.idx), 1);
    renderCurrentView();
  }));

  document.getElementById("addStageBtn").addEventListener("click", () => {
    const enInput = document.getElementById("newStageEn");
    const en = enInput.value.trim();
    if (!en) return;
    const label = { vi: en, en };
    const id = uniqueStageId(en);
    const newStage = { id, label };
    if (ORDER_STAGES.length > 0) ORDER_STAGES.splice(ORDER_STAGES.length - 1, 0, newStage);
    else ORDER_STAGES.push(newStage);
    STAGE_ICONS[id] = "edit";
    STAGE_CHECKLIST_DEFAULTS[id] = [];
    STAGE_GUIDE[id] = { steps: [], keyPoint: { en: "", vi: "" } };
    STAGE_REQUIRED_DOCS[id] = [];
    renderSidebar(); renderCurrentView(); renderPanel();
  });
}

function renderTasksView() {
  const host = document.getElementById("viewHost");
  const all = getAllTasks().filter((tk) => matchesSearch(tk.label));
  const open = all.filter((tk) => !tk.done);
  const done = all.filter((tk) => tk.done);

  function proofChip(p, tk, pi) {
    const isImg = (p.type || "").startsWith("image/");
    return `<span class="proof-chip">
      ${isImg ? `<img class="proof-thumb" src="${p.url}" alt="">` : `<span class="proof-file-ico">${icon("file-text", 12)}</span>`}
      <span class="proof-chip-text">
        <span class="proof-chip-name">${esc(p.name)}</span>
        <span class="proof-chip-meta">${t().uploadedBy} ${esc(workerName(p.uploadedBy) || "—")}</span>
      </span>
      <button type="button" class="proof-chip-remove" data-proofremove="${tk.id}" data-source="${tk.source}" data-pidx="${pi}" title="${t().remove}">${icon("x", 11)}</button>
    </span>`;
  }

  function taskRow(tk) {
    const meta = tk.source === "checklist" ? `${esc(tk.orderName)} · ${esc(tk.stageLabel)}` : t().standaloneTask;
    const assigned = !!tk.assigneeId;
    const mine = tk.assigneeId === currentWorkerId;
    const proofOpen = expandedProofTaskId === tk.id;
    return `<div class="task-item ${tk.done ? "done" : ""}">
      <div class="task-item-main">
        <button type="button" class="check-box-btn" data-taskdone="${tk.id}" data-source="${tk.source}">
          <span class="check-box ${tk.done ? "done" : ""}">${tk.done ? icon("check", 12) : ""}</span>
        </button>
        <span class="task-text">
          <span class="check-label ${tk.done ? "done" : ""}">${esc(tk.label)}</span>
          <span class="task-meta">${meta}</span>
        </span>
      </div>
      <div class="task-controls">
        <span class="assignee-chip ${assigned ? "assigned" : "open"}">${icon("user", 11)}${assigned ? `${t().assignedTo} ${esc(workerName(tk.assigneeId) || "—")}` : t().unassigned}</span>
        ${!assigned ? `<button type="button" class="pill-mini" data-claim="${tk.id}" data-source="${tk.source}">${icon("user-plus", 12)}${t().applyForTask}</button>` : ""}
        ${assigned && mine ? `<button type="button" class="pill-mini" data-release="${tk.id}" data-source="${tk.source}">${t().releaseTask}</button>` : ""}
        <button type="button" class="pill-mini ${proofOpen ? "active" : ""}" data-prooftoggle="${tk.id}">${icon("paperclip", 12)}${t().proofOfProcess}${tk.proof.length ? ` (${tk.proof.length})` : ""}</button>
      </div>
      ${proofOpen ? `
        <div class="proof-panel">
          ${tk.proof.length === 0 ? `<p class="proof-empty">${t().noProofYet}</p>` : `<div class="proof-chip-row">${tk.proof.map((p, pi) => proofChip(p, tk, pi)).join("")}</div>`}
          <label class="ghost-btn proof-upload-btn">
            ${icon("upload", 13)}${t().addProof}
            <input type="file" accept="image/*,.pdf" multiple class="proof-file-input" data-proofinput="${tk.id}" data-source="${tk.source}">
          </label>
        </div>` : ""}
    </div>`;
  }

  const workerOptions = WORKERS.map((w) => `<option value="${w.id}" ${w.id === currentWorkerId ? "selected" : ""}>${esc(w.name)}</option>`).join("");

  host.innerHTML = `
    <div class="acting-as-row">
      <span class="acting-as-label">${icon("user", 13)}${t().actingAs}</span>
      <select class="text-input acting-as-select" id="actingAsSelect">${workerOptions}</select>
      <span class="acting-as-hint">${t().actingAsHint}</span>
    </div>
    ${open.length === 0 && done.length === 0 ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().tasksEmpty}</p>` : ""}
    ${open.length > 0 ? `<div class="section-label">${t().tasksOpenSection}</div>${open.map(taskRow).join("")}` : ""}
    <div class="add-row">
      <input class="text-input" id="newTaskInput" placeholder="${t().newTaskPlaceholder}">
      <button class="ghost-btn" id="addTaskBtn">+ ${t().addTask}</button>
    </div>
    ${done.length > 0 ? `<div class="section-label">${t().tasksDoneSection}</div>${done.map(taskRow).join("")}` : ""}
  `;

  document.getElementById("actingAsSelect").addEventListener("change", (e) => {
    currentWorkerId = e.target.value; renderCurrentView();
  });
  host.querySelectorAll("[data-taskdone]").forEach((el) => el.addEventListener("click", () => {
    const id = el.dataset.taskdone, source = el.dataset.source;
    if (source === "checklist") {
      const sep = id.lastIndexOf("__");
      toggleOrderChecklistItem(id.slice(0, sep), Number(id.slice(sep + 2)));
    } else {
      const tk = STANDALONE_TASKS.find((s) => s.id === id);
      if (tk) tk.done = !tk.done;
      renderCurrentView(); renderSidebar();
    }
  }));
  host.querySelectorAll("[data-claim]").forEach((el) => el.addEventListener("click", () => claimTask(el.dataset.claim, el.dataset.source)));
  host.querySelectorAll("[data-release]").forEach((el) => el.addEventListener("click", () => releaseTask(el.dataset.release, el.dataset.source)));
  host.querySelectorAll("[data-prooftoggle]").forEach((el) => el.addEventListener("click", () => {
    const id = el.dataset.prooftoggle;
    expandedProofTaskId = expandedProofTaskId === id ? null : id;
    renderCurrentView();
  }));
  host.querySelectorAll("[data-proofinput]").forEach((el) => el.addEventListener("change", () => {
    if (el.files && el.files.length) addProofToTask(el.dataset.proofinput, el.dataset.source, el.files);
  }));
  host.querySelectorAll("[data-proofremove]").forEach((el) => el.addEventListener("click", () => {
    removeProofFromTask(el.dataset.proofremove, el.dataset.source, Number(el.dataset.pidx));
  }));
  document.getElementById("addTaskBtn").addEventListener("click", () => {
    const input = document.getElementById("newTaskInput");
    const val = input.value.trim();
    if (!val) return;
    STANDALONE_TASKS.push({ id: "task-" + Date.now() + "-" + Math.floor(Math.random() * 1000), label: val, done: false, assigneeId: null, proof: [] });
    renderCurrentView(); renderSidebar();
  });
}

function renderIssuesMasterView() {

  const filtered = (activeIssueCategoryMaster === "all" ? ISSUES : ISSUES.filter((i) => i.category === activeIssueCategoryMaster))
    .filter((i) => matchesSearch(i.title));
  const sorted = [...filtered.filter((i) => !i.resolved), ...filtered.filter((i) => i.resolved)];
  const catFilterHtml = `
    <div class="cat-filter-row">
      <button type="button" class="chip ${activeIssueCategoryMaster === "all" ? "active" : ""}" data-catfilter="all">${t().allCategories}</button>
      ${ISSUE_CATEGORIES.map((c) => `<button type="button" class="chip ${activeIssueCategoryMaster === c.id ? "active" : ""}" data-catfilter="${c.id}">${c.label[lang]}</button>`).join("")}
    </div>`;
  const tableHtml = sorted.length === 0 ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().issuesEmpty}</p>` : `
    <div class="issues-table-wrap">
      <table class="issues-table">
        <thead><tr>
          <th>${t().colOrderShort}</th><th>${t().colIssueCol}</th><th>${t().category}</th><th>${t().impact}</th><th>${t().suggestedFix}</th><th>${t().escalateTo}</th><th>${t().colActionsCol}</th>
        </tr></thead>
        <tbody>
          ${sorted.map((i) => {
            const order = ORDERS.find((o) => o.id === i.orderId);
            return `<tr class="${i.resolved ? "resolved" : ""}">
              <td>${order ? `<a href="#" data-open="${order.id}" style="color:var(--jade);font-weight:600;text-decoration:none;">${order.id}</a>` : "—"}</td>
              <td><div class="issue-row-title">${esc(i.title)}</div></td>

              <td><span class="impact-badge" style="color:${i.impact === "high" ? "var(--lacquer)" : i.impact === "medium" ? "var(--brassOnPaper)" : "var(--jadeSoft)"};">${i.impact === "high" ? t().high : i.impact === "medium" ? t().medium : t().low}</span></td>
              <td style="max-width:220px;">${esc(i.suggestedFix) || "—"}</td>
              <td>${esc(i.escalateTo) || "—"}</td>

      </table>

  host.innerHTML = `${catFilterHtml}${tableHtml}`;
  host.querySelectorAll("[data-catfilter]").forEach((b) => b.addEventListener("click", () => { activeIssueCategoryMaster = b.dataset.catfilter; renderCurrentView(); }));

  host.querySelectorAll("[data-resolve]").forEach((b) => b.addEventListener("click", () => {

    renderCurrentView(); renderSidebar();
  }));
  host.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", () => {
    ISSUES = ISSUES.filter((x) => x.id !== b.dataset.remove);
    renderCurrentView(); renderSidebar();
  }));

function renderReportsView() {
  const host = document.getElementById("viewHost");
  const totalOrders = ORDERS.length;
  const openIssuesCount = ISSUES.filter((i) => !i.resolved).length;
  const inProgress = ORDERS.filter((o) => o.stage !== "completed");
  let doneItems = 0, totalItems = 0;
  inProgress.forEach((o) => { effectiveChecklist(o).forEach((it) => { totalItems++; if (it.done) doneItems++; }); });
  const completionPct = totalItems === 0 ? null : Math.round((doneItems / totalItems) * 100);

  function barSection(title, rows) {
    const max = Math.max(1, ...rows.map((r) => r.count));
    return `
      <div class="section-label">${title}</div>
      ${rows.length === 0 ? `<p style="font-size:12.5px;color:var(--jadeSoft);">${t().noDataYet}</p>` : rows.map((r) => `
        <div class="bar-row">
          <span class="bar-label">${esc(r.label)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${(r.count / max) * 100}%"></span></span>
          <span class="bar-count">${r.count}</span>
        </div>`).join("")}`;
  }

  const byStage = ORDER_STAGES.map((s) => ({ label: s.label[lang], count: ORDERS.filter((o) => o.stage === s.id).length })).filter((r) => r.count > 0);
  const byType = [
    { label: t().wholesale, count: ORDERS.filter((o) => o.type === "wholesale").length },
    { label: t().retail, count: ORDERS.filter((o) => o.type === "retail").length },
  ].filter((r) => r.count > 0);
  const byCategory = ISSUE_CATEGORIES.map((c) => ({ label: c.label[lang], count: ISSUES.filter((i) => i.category === c.id && !i.resolved).length })).filter((r) => r.count > 0);
  const byImpact = [
    { label: t().high, count: ISSUES.filter((i) => i.impact === "high" && !i.resolved).length },
    { label: t().medium, count: ISSUES.filter((i) => i.impact === "medium" && !i.resolved).length },
    { label: t().low, count: ISSUES.filter((i) => i.impact === "low" && !i.resolved).length },
  ].filter((r) => r.count > 0);

  host.innerHTML = `
    <div class="stat-grid">
      <div class="meta-item"><div class="meta-label">${t().navOrders}</div><div class="meta-value">${totalOrders}</div></div>
      <div class="meta-item"><div class="meta-label">${t().issues}</div><div class="meta-value">${openIssuesCount}</div></div>
      <div class="meta-item"><div class="meta-label">${t().reportChecklistCompletion}</div><div class="meta-value">${completionPct === null ? "—" : completionPct + "%"}</div></div>
    </div>
    ${barSection(t().reportOrdersByStage, byStage)}
    ${barSection(t().reportOrdersByType, byType)}
    ${barSection(t().reportIssuesByCategory, byCategory)}
    ${barSection(t().reportIssuesByImpact, byImpact)}
  `;
}

function renderSettingsView() {
  const host = document.getElementById("viewHost");
  host.innerHTML = `
    <div class="section-label">${t().settingsTheme}</div>

      <button type="button" class="chip with-icon ${theme === "light" ? "active" : ""}" data-settheme="light">${icon("sun", 12)}${t().light}</button>

    <div class="section-label">${t().teamTitle}</div>
    <div class="team-list">
      ${WORKERS.map((w) => `
        <span class="team-chip">${icon("user", 12)}${esc(w.name)}
          <button type="button" class="team-chip-remove" data-removeworker="${w.id}" title="${t().remove}">${icon("x", 11)}</button>
        </span>`).join("")}
    </div>
    <div class="add-row">
      <input class="text-input" id="newWorkerInput" placeholder="${t().newWorkerPlaceholder}">
      <button class="ghost-btn" id="addWorkerBtn">+ ${t().addWorker}</button>
    </div>
    <p class="team-example-note">${t().teamExampleNote}</p>
    <div class="section-label">${t().settingsDataTitle}</div>
    <div class="info-note"><span>${icon("lightbulb", 14)}</span><span>${t().settingsDataText}</span></div>
  `;
  host.querySelectorAll("[data-settheme]").forEach((b) => b.addEventListener("click", () => {
    theme = b.dataset.settheme; document.body.setAttribute("data-theme", theme); renderAll();
  }));
  document.getElementById("addWorkerBtn").addEventListener("click", () => {
    const input = document.getElementById("newWorkerInput");
    const val = input.value.trim();
    if (!val) return;
    WORKERS.push({ id: "w-" + Date.now() + "-" + Math.floor(Math.random() * 1000), name: val });
    renderCurrentView();
  });
  host.querySelectorAll("[data-removeworker]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.removeworker;
    if (WORKERS.length <= 1) { showToast(t().cantRemoveLastWorker); return; }
    WORKERS = WORKERS.filter((w) => w.id !== id);
    if (currentWorkerId === id) currentWorkerId = WORKERS[0].id;
    renderCurrentView();
  }));

function effectiveChecklist(order) {
  const saved = order.stageChecklist?.[order.stage];
  if (saved) return saved;
  return (STAGE_CHECKLIST_DEFAULTS[order.stage] || []).map((d) => ({ label: d[lang], done: false, assigneeId: null, proof: [] }));
}
function saveChecklist(order, items) {
  order.stageChecklist = { ...(order.stageChecklist || {}), [order.stage]: items };
  renderCurrentView(); renderPanel();
}

function renderPanel() {
  let host = document.getElementById("panelHost");
  if (host) host.remove();
  if (!openOrderId) { lastRenderedOrderId = null; return; }
  const order = ORDERS.find((o) => o.id === openOrderId);
  if (!order) { openOrderId = null; lastRenderedOrderId = null; return; }
  const issues = ISSUES.filter((i) => i.orderId === order.id);
  const openCount = issues.filter((i) => !i.resolved).length;
  const isFreshOpen = openOrderId !== lastRenderedOrderId;
  lastRenderedOrderId = openOrderId;

  host = document.createElement("div");
  host.id = "panelHost";
  host.className = "panel-overlay";
  host.addEventListener("click", () => { openOrderId = null; renderPanel(); });

  const currentIdx = ORDER_STAGES.findIndex((s) => s.id === order.stage);
  const isDone = order.stage === "completed";
  const stepsHtml = ORDER_STAGES.map((s, idx) => {
    const cls = idx === currentIdx ? "active" : idx < currentIdx ? "done" : "";
    const ico = idx < currentIdx ? icon("check", 12) : icon(STAGE_ICONS[s.id], 12);
    return `<button type="button" class="step-btn ${cls}" data-stage="${s.id}"><span class="step-ico">${ico}</span>${s.label[lang]}</button>`;
  }).join("");

  const tabsHtml = `
    <button class="tab-btn ${activeTab === "checklist" ? "active" : ""}" data-tab="checklist">${icon("clipboard-list", 14)} ${t().checklist}</button>
    <button class="tab-btn ${activeTab === "issues" ? "active" : ""}" data-tab="issues">${icon("alert-triangle", 14)} ${t().issues}${openCount ? ` <span class="tab-badge">${openCount}</span>` : ""}</button>
    <button class="tab-btn ${activeTab === "documents" ? "active" : ""}" data-tab="documents">${icon("file-text", 14)} ${t().documents}</button>
    <button class="tab-btn ${activeTab === "guide" ? "active" : ""}" data-tab="guide">${icon("book-open", 14)} ${t().guide}</button>
  `;

  const kind = contactKind(order.contact);
  let quickActionsHtml;
  if (kind === "phone") {
    quickActionsHtml = `<div class="quick-actions">
        <a class="quick-btn" href="tel:${esc(order.contact)}"><span class="ico">${icon("phone", 11)}</span>${t().call}</a>
        <a class="quick-btn" href="sms:${esc(order.contact)}"><span class="ico">${icon("message-circle", 11)}</span>${t().message}</a>
      </div>`;
  } else if (kind === "email") {
    quickActionsHtml = `<div class="quick-actions">
        <a class="quick-btn" href="mailto:${esc(order.contact)}"><span class="ico">${icon("mail", 11)}</span>${t().message}</a>
      </div>`;
  } else {
    quickActionsHtml = `<p class="quick-actions-empty">${t().noContactMethod}</p>`;
  }

  let bodyHtml = "";
  if (activeTab === "checklist") {
    const items = effectiveChecklist(order);
    bodyHtml = `
      ${items.length === 0 ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().checklistEmpty}</p>` : ""}
      ${items.map((it, idx) => `
        <button type="button" class="check-item" data-toggle="${idx}">
          <span class="check-box ${it.done ? "done" : ""}">${it.done ? icon("check", 12) : ""}</span>
          <span class="check-label ${it.done ? "done" : ""}">${esc(it.label)}</span>
        </button>`).join("")}
      <div class="add-row">
        <input class="text-input" id="newChecklistItem" placeholder="${t().newItem}">
        <button class="ghost-btn" id="addChecklistBtn">+ ${t().addItem}</button>
      </div>`;
  } else if (activeTab === "issues") {
    const filtered = activeIssueCategory === "all" ? issues : issues.filter((i) => i.category === activeIssueCategory);
    const sorted = [...filtered.filter((i) => !i.resolved), ...filtered.filter((i) => i.resolved)];
    const catFilterHtml = `
      <div class="cat-filter-row">
        <button type="button" class="chip ${activeIssueCategory === "all" ? "active" : ""}" data-catfilter="all">${t().allCategories}</button>
        ${ISSUE_CATEGORIES.map((c) => `<button type="button" class="chip ${activeIssueCategory === c.id ? "active" : ""}" data-catfilter="${c.id}">${c.label[lang]}</button>`).join("")}
      </div>`;
    const tableHtml = sorted.length === 0 ? "" : `
      <div class="issues-table-wrap">
        <table class="issues-table">
          <thead><tr>
            <th>${t().colIssueCol}</th><th>${t().category}</th><th>${t().impact}</th><th>${t().suggestedFix}</th><th>${t().escalateTo}</th><th>${t().colActionsCol}</th>
          </tr></thead>
          <tbody>
            ${sorted.map((i) => `
              <tr class="${i.resolved ? "resolved" : ""}">
                <td><div class="issue-row-title">${esc(i.title)}</div></td>
                <td><span class="issue-row-cat">${(ISSUE_CATEGORIES.find((c) => c.id === i.category)?.label[lang]) || i.category}</span></td>
                <td><span class="impact-badge" style="color:${i.impact === "high" ? "var(--lacquer)" : i.impact === "medium" ? "var(--brassOnPaper)" : "var(--jadeSoft)"};">${i.impact === "high" ? t().high : i.impact === "medium" ? t().medium : t().low}</span></td>
                <td style="max-width:220px;">${esc(i.suggestedFix) || "—"}</td>

                <td><div class="issue-row-actions">
                  <button class="small-btn" data-resolve="${i.id}">${i.resolved ? t().reopen : t().resolve}</button>
                  <button class="small-btn danger" data-remove="${i.id}">${t().remove}</button>
                </div></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    bodyHtml = `
      ${issues.length > 0 ? catFilterHtml : ""}
      ${issues.length === 0 ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().issuesEmpty}</p>` : ""}
      ${filtered.length === 0 && issues.length > 0 ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().issuesEmpty}</p>` : ""}
      ${tableHtml}
      <button class="ghost-btn" id="openIssueForm" style="border-style:dashed;margin-top:12px;">+ ${t().reportIssue}</button>
      <div id="issueFormHost"></div>
      <div class="escalate-callout">
        <span class="icon">${icon("alert-triangle", 15)}</span>
        <div class="body"><div class="title">${t().escalateWhen}</div>${t().escalateWhenText}</div>
      </div>`;
  } else if (activeTab === "documents") {
    const resources = order.resources || [];
    const docLog = order.docLog || [];
    const previewHtml = docModalKind === "invoice" ? buildInvoiceHtml(order) : buildPackingSlipHtml(order);
    bodyHtml = `
      <div class="doc-columns">
        <div class="doc-left">
          <div class="section-label">${t().quickActionsLabel}</div>
          <div class="quick-tile-grid">
            ${kind === "phone" ? `<a class="quick-tile" href="tel:${esc(order.contact)}"><span class="ico">${icon("phone", 13)}</span><span class="lbl">${t().call}</span></a>` : ""}
            ${kind ? `<a class="quick-tile" href="${kind === "phone" ? "sms:" : "mailto:"}${esc(order.contact)}"><span class="ico">${icon("message-circle", 13)}</span><span class="lbl">${t().message}</span></a>` : ""}
            <button type="button" class="quick-tile" data-doc="invoice"><span class="ico">${icon("file-text", 13)}</span><span class="lbl">${t().invoice}</span></button>

          </div>

          <div class="section-label">${t().resources}</div>
          ${resources.length === 0 ? `<p style="font-size:12px;color:var(--jadeSoft);margin:0 0 8px;">${t().resourcesEmpty}</p>` : ""}
          ${resources.map((r, idx) => `
            <div class="resource-row">
              <a class="resource-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${icon("link", 13)}<span>${esc(r.label)}</span></a>
              <button class="resource-remove" data-removeresource="${idx}" title="${t().remove}">${icon("x", 13)}</button>
            </div>`).join("")}
          <div class="add-row">
            <input class="text-input" id="newResourceLabel" placeholder="${t().resourceLabel}">
            <input class="text-input" id="newResourceUrl" placeholder="${t().resourceUrl}">
            <button class="ghost-btn" id="addResourceBtn">+ ${t().addResource}</button>
          </div>

          <div class="section-label">${t().recentDocuments}</div>
          ${docLog.length === 0 ? `<p style="font-size:12px;color:var(--jadeSoft);margin:0;">${t().noDocsYet}</p>` : `
            <div>${docLog.slice(0, 6).map((d) => `
              <div class="doclog-row">
                <span class="doclog-kind">${d.action === "printed" ? t().printed : t().generated} — ${d.kind === "invoice" ? t().invoice : t().packingSlip}</span>
                <span class="doclog-meta">${esc(d.at.toLocaleTimeString(lang === "vi" ? "vi-VN" : "en-US", { hour: "2-digit", minute: "2-digit" }))}</span>
              </div>`).join("")}</div>`}
        </div>
        <div class="doc-right">
          <div class="doc-kind-switch">
            <button type="button" class="doc-kind-btn ${docModalKind === "invoice" ? "active" : ""}" data-previewkind="invoice">${t().invoice}</button>
            <button type="button" class="doc-kind-btn ${docModalKind === "packing-slip" ? "active" : ""}" data-previewkind="packing-slip">${t().packingSlip}</button>
          </div>
          <div class="doc-frame-wrap"><iframe srcdoc="${esc(previewHtml)}"></iframe></div>
          <div class="doc-right-foot"><button class="print-btn" id="printDocBtn">${icon("printer", 15)} ${t().printSave}</button></div>
        </div>
      </div>
      `;
  } else {
    const guide = STAGE_GUIDE[order.stage];
    bodyHtml = !guide ? `<p style="font-size:13px;color:var(--jadeSoft);">${t().guideEmpty}</p>` : `
      <ol class="guide-steps">${guide.steps.map((s) => `<li>${esc(s[lang])}</li>`).join("")}</ol>
      <div class="guide-keypoint">
        <span class="icon">${icon("lightbulb", 15)}</span>
        <div class="body"><div class="title">${t().keyPoint}</div>${esc(guide.keyPoint[lang])}</div>
      </div>`;
  }

  host.innerHTML = `
    <div class="panel ${isFreshOpen ? "" : "no-anim"}" id="panelEl">
      <div class="panel-topbar"></div>
      <div class="panel-head">
        <div>
          <p class="panel-crumb">${t().flowLabel} / ${order.stage ? ORDER_STAGES.find((s) => s.id === order.stage)?.label[lang] : ""} / ${order.id}${order.example ? " · EXAMPLE" : ""}</p>
          <div class="panel-title-row">
            <h2 class="panel-title">${esc(order.customerName)}</h2>
            <span class="status-pill ${isDone ? "done" : "inprogress"}">${isDone ? ORDER_STAGES[ORDER_STAGES.length - 1].label[lang] : t().inProgress}</span>

        </div>
