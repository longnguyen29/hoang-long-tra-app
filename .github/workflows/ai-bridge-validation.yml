name: Validate AI task contract
on:
  pull_request:
    paths:
      - '.ai/tasks/**'
      - '.ai/policy.json'
      - '.ai/task.schema.json'
      - 'scripts/ai_bridge.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/ai_bridge.py validate
